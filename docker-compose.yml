# docker-compose

services:
  web:
    build:
      context: ./quequeue-backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./quequeue-backend:/app
    ports:
      - "8000:8000"
    env_file:
      - path: ./quequeue-backend/.env
        required: false
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - db
      - redis

  worker:
    build:
      context: ./quequeue-backend
    command: celery -A quequeue_project worker --loglevel=info
    volumes:
      - ./quequeue-backend:/app
    env_file:
      - path: ./quequeue-backend/.env
        required: false
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - db
      - redis

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: quequeue_db
      POSTGRES_USER: quequeue_user
      POSTGRES_PASSWORD: quequeue_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  frontend:
    image: node:18
    working_dir: /app
    environment:
      - IS_DOCKER=true
      - VITE_API_URL=http://127.0.0.1:8000
    volumes:
      - ./quequeue-frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - web

volumes:
  pgdata:
